version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pdf_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_NAME=Async PDF Processing API
      - DEBUG=false
      - PDF_TTL_SECONDS=86400
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WORKER_CONCURRENCY=5
      - DEBUG=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_CONCURRENCY=${GEMINI_CONCURRENCY:-2}
      - SUMMARY_MAX_INPUT_CHARS=${SUMMARY_MAX_INPUT_CHARS:-100000}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_OCR_MODEL=${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      - MISTRAL_CONCURRENCY=${MISTRAL_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, redis; r = redis.from_url('redis://redis:6379/0'); sys.exit(0 if len(r.keys('worker:heartbeat:*')) > 0 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
    name: pdf_redis_data
