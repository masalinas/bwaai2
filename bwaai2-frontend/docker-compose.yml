version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf_frontend
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=http://api:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
